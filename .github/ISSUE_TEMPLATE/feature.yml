name: Feature
description: New behaviour or content
labels: ["enhancement"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves and who it's for.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in, and what's deliberately out and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable against the repo.
    validations:
      required: true
