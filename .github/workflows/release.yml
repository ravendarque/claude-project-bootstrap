name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (docs/versioning.md)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          node .github/scripts/plan-releases.mjs > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup-node-pnpm
        if: steps.plan.outputs.count != '0' && hashFiles('.github/actions/setup-node-pnpm/action.yml') != ''

      - name: Build release artefacts
        if: steps.plan.outputs.count != '0' && hashFiles('.github/scripts/build-artefacts.sh') != ''
        run: bash .github/scripts/build-artefacts.sh

      # A tag pushed with GITHUB_TOKEN doesn't trigger other workflows; the release App's token does.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.plan.outputs.count != '0'
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create and push the tags, oldest first
        if: steps.plan.outputs.count != '0'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          newest=$(jq -r '.[-1].version' "$RUNNER_TEMP/plan.json")
          jq -c '.[]' "$RUNNER_TEMP/plan.json" | while read -r release; do
            version=$(jq -r .version <<< "$release")
            git tag -a "$version" -m "$version" "$(jq -r .sha <<< "$release")"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$version"
            assets=()
            if [ "$version" = "$newest" ] && [ -d artefacts ]; then
              mapfile -t assets < <(find artefacts -maxdepth 1 -type f)
            fi
            gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "$version" --generate-notes "${assets[@]}" \
              || echo "::warning::Tag $version pushed, but its GitHub Release wasn't created."
          done
