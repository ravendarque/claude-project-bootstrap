name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - name: Rendered templates are Biome-formatted
        run: |
          dir="$(mktemp -d)"
          printf '%s' '{"name":"Sample Project","description":"A sample project.","owner":"sample-owner","visibility":"public","zone_name":"example.com","beta":true}' > "$dir/answers.json"
          node skills/bootstrap/scripts/render.mjs --modules core,js-toolchain,web-app,cloudflare-opentofu --answers "$dir/answers.json" --dest "$dir/project"
          spec="$(node -p 'require(process.argv[1]).devDependencies["@biomejs/biome"]' "$dir/project/package.json")"
          cd "$dir/project"
          npx --yes "@biomejs/biome@$spec" format .
      - name: Validate plugin manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate .
      - name: Identifier guard
        env:
          IDENTIFIER_DENYLIST: ${{ secrets.IDENTIFIER_DENYLIST }}
        run: |
          if [ -z "$IDENTIFIER_DENYLIST" ]; then
            echo "::warning::IDENTIFIER_DENYLIST isn't available to this run (Dependabot or a fork), so the identifier guard was skipped."
            exit 0
          fi
          node skills/bootstrap/scripts/check-identifiers.mjs .
