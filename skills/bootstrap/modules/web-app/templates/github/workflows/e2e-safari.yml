name: E2E Safari

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - run: sudo safaridriver --enable
      - run: pnpm test:e2e
        env:
          E2E_BROWSERS: safari
