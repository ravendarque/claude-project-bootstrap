name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "infra/**"
      - "test/**"
      - "e2e/**"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - run: pnpm build
      - name: Upload the Preview
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUTPUT=$(pnpm exec wrangler preview --env preview --name "pr-$PR_NUMBER" --json)
          URL=$(echo "$OUTPUT" | sed -n '/^{/,$p' | jq -r '.preview.urls[0] // empty')
          if [ -z "$URL" ]; then
            echo "$OUTPUT" >&2
            echo "::error::wrangler didn't report a Preview URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment the Preview URL
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --body "Preview: $PREVIEW_URL" \
            || gh pr comment "$PR_NUMBER" --body "Preview: $PREVIEW_URL"

  cleanup:
    if: github.actor != 'dependabot[bot]' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - name: Delete the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec wrangler preview delete --env preview --name "pr-$PR_NUMBER" --skip-confirmation
