version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "release: patch"
    cooldown:
      default-days: 4
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "release: none"
    cooldown:
      default-days: 4
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
